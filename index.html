<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Watchdog — VPS Dashboard</title>
<style>
/* ═══════════════════════════════════════════
   HERMES WATCHDOG — Design System
   Dark · Glass Morphism · Vibrant Accents
   ═══════════════════════════════════════════ */

:root {
  --bg-deep: #06090f;
  --bg-card: rgba(13, 17, 23, 0.75);
  --bg-card-hover: rgba(18, 24, 32, 0.85);
  --bg-elevated: rgba(22, 27, 34, 0.8);
  --border-subtle: rgba(255,255,255,0.06);
  --border-glow: rgba(0, 212, 255, 0.15);
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #5c6670;
  --accent-cyan: #00d4ff;
  --accent-purple: #a855f7;
  --accent-emerald: #10b981;
  --accent-amber: #f59e0b;
  --accent-rose: #ef4444;
  --accent-pink: #ec4899;
  --gradient-hero: linear-gradient(135deg, #0a1628 0%, #0d1b33 50%, #0a0e1a 100%);
  --gradient-cyan: linear-gradient(135deg, #00d4ff, #0090ff);
  --gradient-purple: linear-gradient(135deg, #a855f7, #7c3aed);
  --gradient-alert: linear-gradient(135deg, #ef4444, #dc2626);
  --shadow-glow: 0 0 30px rgba(0, 212, 255, 0.08);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Ambient background effect */
body::before {
  content: '';
  position: fixed;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(0, 212, 255, 0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 30%, rgba(168, 85, 247, 0.03) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(16, 185, 129, 0.02) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ═══════════ HEADER ═══════════ */
.header {
  position: relative;
  z-index: 1;
  padding: 2rem 2rem 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
  border-bottom: 1px solid var(--border-subtle);
}

.header-left { display: flex; align-items: center; gap: 1rem; }

.logo-pulse {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--gradient-cyan);
  position: relative;
  animation: pulse-ring 2s ease-in-out infinite;
}
.logo-pulse::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 2px solid var(--accent-cyan);
  opacity: 0.4;
  animation: pulse-ring-outer 2s ease-in-out infinite;
}
@keyframes pulse-ring {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,212,255,0.3); }
  50% { box-shadow: 0 0 0 12px rgba(0,212,255,0); }
}
@keyframes pulse-ring-outer {
  0%, 100% { transform: scale(1); opacity: 0.3; }
  50% { transform: scale(1.5); opacity: 0; }
}

.header h1 {
  font-size: 1.6rem;
  font-weight: 700;
  background: var(--gradient-cyan);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.02em;
}

.header-meta {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  font-size: 0.82rem;
  color: var(--text-secondary);
}

.status-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-right: 6px;
}
.status-dot.live { background: var(--accent-emerald); box-shadow: 0 0 8px var(--accent-emerald); }
.status-dot.stale { background: var(--accent-amber); box-shadow: 0 0 8px var(--accent-amber); }

/* ═══════════ ALERT BANNER ═══════════ */
.alert-banner {
  position: relative; z-index: 2;
  margin: 1rem 2rem 0;
  padding: 0.9rem 1.3rem;
  border-radius: var(--radius-md);
  background: rgba(239, 68, 68, 0.12);
  border: 1px solid rgba(239, 68, 68, 0.25);
  display: none;
  align-items: center;
  gap: 0.8rem;
  animation: slideDown 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: blur(12px);
}
.alert-banner.show { display: flex; }
.alert-banner.critical {
  background: rgba(239, 68, 68, 0.12);
  border-color: rgba(239, 68, 68, 0.25);
}
.alert-banner.warning {
  background: rgba(245, 158, 11, 0.08);
  border-color: rgba(245, 158, 11, 0.2);
}
.alert-icon { font-size: 1.3rem; flex-shrink: 0; }
.alert-text { flex: 1; font-size: 0.88rem; }
.alert-text strong { color: var(--accent-rose); }
.alert-close {
  background: none; border: none; color: var(--text-muted);
  cursor: pointer; font-size: 1.1rem; padding: 4px;
  transition: var(--transition-fast);
}
.alert-close:hover { color: var(--text-primary); }

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ═══════════ TAB NAVIGATION ═══════════ */
.tab-nav {
  position: relative; z-index: 1;
  display: flex;
  gap: 0.3rem;
  margin: 1.5rem 2rem 0;
  padding: 0.35rem;
  background: var(--bg-card);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  backdrop-filter: blur(16px);
  width: fit-content;
}

.tab-btn {
  background: none;
  border: none;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 500;
  padding: 0.55rem 1.2rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition-smooth);
  white-space: nowrap;
  position: relative;
}
.tab-btn:hover { color: var(--text-primary); background: rgba(255,255,255,0.03); }
.tab-btn.active {
  color: var(--accent-cyan);
  background: rgba(0, 212, 255, 0.08);
  box-shadow: 0 0 20px rgba(0, 212, 255, 0.06);
}
.tab-badge {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 7px;
  border-radius: 10px;
  font-size: 0.7rem;
  font-weight: 700;
  background: var(--accent-rose);
  color: #fff;
}

/* ═══════════ CONTENT ═══════════ */
.content {
  position: relative; z-index: 1;
  padding: 1.5rem 2rem 3rem;
}

.tab-panel { display: none; animation: fadeIn 0.35s ease; }
.tab-panel.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ═══════════ CARDS ═══════════ */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 1.2rem 1.3rem;
  backdrop-filter: blur(16px);
  transition: var(--transition-smooth);
  position: relative;
  overflow: hidden;
}
.card:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-glow);
  transform: translateY(-2px);
  box-shadow: var(--shadow-glow);
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--gradient-cyan);
  opacity: 0;
  transition: opacity 0.3s;
}
.card:hover::before { opacity: 1; }

.card-label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 0.5rem;
  font-weight: 600;
}

.card-value {
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  background: var(--gradient-cyan);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.card-sub {
  font-size: 0.78rem;
  color: var(--text-secondary);
  margin-top: 0.3rem;
}

/* Card variants */
.card.ram .card-value { background: linear-gradient(135deg, #60a5fa, #3b82f6); -webkit-background-clip: text; background-clip: text; }
.card.disk .card-value { background: linear-gradient(135deg, #f59e0b, #d97706); -webkit-background-clip: text; background-clip: text; }
.card.tokens .card-value { background: linear-gradient(135deg, #a855f7, #7c3aed); -webkit-background-clip: text; background-clip: text; }
.card.cost .card-value { background: linear-gradient(135deg, #10b981, #059669); -webkit-background-clip: text; background-clip: text; }

/* progress bar */
.progress-bar {
  height: 6px;
  background: rgba(255,255,255,0.06);
  border-radius: 3px;
  margin-top: 0.6rem;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}
.progress-fill.safe { background: var(--gradient-cyan); }
.progress-fill.warn { background: linear-gradient(135deg, #f59e0b, #d97706); }
.progress-fill.danger { background: linear-gradient(135deg, #ef4444, #dc2626); }

/* ═══════════ PROFILE TABLE ═══════════ */
.profile-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.profile-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 1.3rem;
  backdrop-filter: blur(16px);
  transition: var(--transition-smooth);
}
.profile-card:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-glow);
  transform: translateY(-2px);
}

.profile-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 1rem;
}
.profile-name {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-primary);
}
.profile-source {
  font-size: 0.7rem;
  padding: 2px 10px;
  border-radius: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.source-telegram { background: rgba(0, 136, 204, 0.15); color: #38bdf8; }
.source-cli { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
.source-tui { background: rgba(16, 185, 129, 0.15); color: #34d399; }
.source-desktop { background: rgba(236, 72, 153, 0.15); color: #f472b6; }
.source-cron { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
.source-subagent { background: rgba(100, 116, 139, 0.15); color: #94a3b8; }

.profile-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
  margin-bottom: 0.8rem;
}
.profile-stat {
  background: var(--bg-elevated);
  border-radius: var(--radius-sm);
  padding: 0.6rem 0.7rem;
}
.profile-stat .stat-label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 2px;
}
.profile-stat .stat-value {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-primary);
}
.profile-model-badge {
  display: inline-block;
  font-size: 0.7rem;
  padding: 3px 10px;
  border-radius: 6px;
  background: rgba(0, 212, 255, 0.08);
  color: var(--accent-cyan);
  margin-top: 0.3rem;
  border: 1px solid rgba(0, 212, 255, 0.15);
}

/* ═══════════ MODEL LIST ═══════════ */
.model-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.model-row {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.8rem 1rem;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  backdrop-filter: blur(12px);
  transition: var(--transition-smooth);
}
.model-row:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-glow);
}

.model-rank {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--text-muted);
  min-width: 36px;
  text-align: center;
}
.model-rank.top1 { color: var(--accent-amber); }
.model-rank.top2 { color: #94a3b8; }
.model-rank.top3 { color: #b45309; }

.model-info { flex: 1; min-width: 0; }
.model-name {
  font-weight: 600;
  font-size: 0.92rem;
  color: var(--text-primary);
}
.model-provider {
  font-size: 0.72rem;
  color: var(--text-secondary);
  margin-top: 2px;
}
.model-bar-wrap {
  flex: 2;
  height: 8px;
  background: rgba(255,255,255,0.05);
  border-radius: 4px;
  overflow: hidden;
}
.model-bar {
  height: 100%;
  border-radius: 4px;
  transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}
.model-tokens {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-secondary);
  min-width: 90px;
  text-align: right;
  white-space: nowrap;
}
.model-percent {
  font-size: 0.75rem;
  color: var(--text-muted);
  min-width: 48px;
  text-align: right;
}

/* Bar colors cycling */
.bar-0 { background: var(--gradient-cyan); }
.bar-1 { background: var(--gradient-purple); }
.bar-2 { background: linear-gradient(135deg, #10b981, #059669); }
.bar-3 { background: linear-gradient(135deg, #f59e0b, #d97706); }
.bar-4 { background: linear-gradient(135deg, #ec4899, #db2777); }
.bar-5 { background: linear-gradient(135deg, #6366f1, #4f46e5); }
.bar-6 { background: linear-gradient(135deg, #14b8a6, #0d9488); }
.bar-7 { background: linear-gradient(135deg, #f97316, #ea580c); }

/* ═══════════ PROJECTION ═══════════ */
.projection-container {
  max-width: 700px;
}

.projection-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 2rem;
  backdrop-filter: blur(16px);
}

.slider-group {
  margin: 1.5rem 0;
}
.slider-label {
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
  margin-bottom: 0.5rem;
}
.slider-label span:last-child {
  font-weight: 700;
  color: var(--accent-cyan);
  font-size: 1.3rem;
}

input[type="range"] {
  -webkit-appearance: none;
  width: 100%;
  height: 8px;
  border-radius: 4px;
  background: rgba(255,255,255,0.08);
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--gradient-cyan);
  cursor: pointer;
  box-shadow: 0 0 16px rgba(0, 212, 255, 0.3);
  transition: var(--transition-fast);
}
input[type="range"]::-webkit-slider-thumb:hover {
  transform: scale(1.15);
  box-shadow: 0 0 24px rgba(0, 212, 255, 0.5);
}

.projection-result {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-top: 1.2rem;
}

.projection-box {
  background: var(--bg-elevated);
  border-radius: var(--radius-md);
  padding: 1rem;
  text-align: center;
  border: 1px solid var(--border-subtle);
}
.projection-box .box-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  margin-bottom: 0.4rem;
}
.projection-box .box-value {
  font-size: 1.5rem;
  font-weight: 700;
  background: var(--gradient-purple);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ═══════════ FOOTER ═══════════ */
.footer {
  position: relative; z-index: 1;
  text-align: center;
  padding: 1.5rem;
  color: var(--text-muted);
  font-size: 0.75rem;
  border-top: 1px solid var(--border-subtle);
  margin-top: 1rem;
}

/* ═══════════ RESPONSIVE ═══════════ */
@media (max-width: 768px) {
  .header { padding: 1.2rem 1rem 0.8rem; }
  .tab-nav { margin: 1rem 1rem 0; overflow-x: auto; }
  .content { padding: 1rem; }
  .profile-grid { grid-template-columns: 1fr; }
  .card-grid { grid-template-columns: 1fr 1fr; }
  .projection-result { grid-template-columns: 1fr; }
  .header h1 { font-size: 1.3rem; }
  .card-value { font-size: 1.5rem; }
}

@media (max-width: 480px) {
  .card-grid { grid-template-columns: 1fr; }
  .header-meta { display: none; }
}

/* ═══════════ FILTER BAR ═══════════ */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 1.2rem;
  flex-wrap: wrap;
}

.filter-chip {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 0.78rem;
  font-weight: 500;
  padding: 0.4rem 0.9rem;
  border-radius: 20px;
  cursor: pointer;
  transition: var(--transition-smooth);
  white-space: nowrap;
  backdrop-filter: blur(8px);
}
.filter-chip:hover {
  border-color: var(--border-glow);
  color: var(--text-primary);
  background: var(--bg-card-hover);
}
.filter-chip.active {
  background: rgba(0, 212, 255, 0.12);
  border-color: rgba(0, 212, 255, 0.3);
  color: var(--accent-cyan);
  box-shadow: 0 0 12px rgba(0, 212, 255, 0.08);
}

.filter-search {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 0.8rem;
  padding: 0.4rem 0.9rem;
  border-radius: 20px;
  width: 180px;
  backdrop-filter: blur(8px);
  transition: var(--transition-smooth);
  outline: none;
}
.filter-search::placeholder { color: var(--text-muted); }
.filter-search:focus {
  border-color: var(--accent-cyan);
  box-shadow: 0 0 12px rgba(0, 212, 255, 0.1);
}

.filter-sort {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 0.78rem;
  padding: 0.4rem 0.7rem;
  border-radius: 20px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  outline: none;
  margin-left: auto;
}
.filter-sort:focus { border-color: var(--accent-cyan); }
.filter-sort option { background: #161b22; color: var(--text-primary); }

.filter-count {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-left: 0.3rem;
}

</style>
</head>
<body>

<!-- ═══════════ HEADER ═══════════ -->
<div class="header">
  <div class="header-left">
    <div class="logo-pulse"></div>
    <div>
      <h1>Hermes Watchdog</h1>
      <div style="font-size:0.72rem;color:var(--text-muted);margin-top:2px">VPS Monitoring &amp; Token Analytics</div>
    </div>
  </div>
  <div class="header-meta">
    <span><span class="status-dot live" id="statusDot"></span><span id="statusText">Conectado</span></span>
    <span id="updateTime">Actualizado: --</span>
  </div>
</div>

<!-- ═══════════ ALERT BANNER ═══════════ -->
<div class="alert-banner" id="alertBanner">
  <span class="alert-icon">⚠️</span>
  <span class="alert-text" id="alertText"></span>
  <button class="alert-close" onclick="dismissAlert()">✕</button>
</div>

<!-- ═══════════ TABS ═══════════ -->
<nav class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('resumen')">📊 Resumen</button>
  <button class="tab-btn" onclick="switchTab('perfiles')">👤 Perfiles</button>
  <button class="tab-btn" onclick="switchTab('modelos')">🤖 Modelos</button>
  <button class="tab-btn" onclick="switchTab('proyeccion')">📈 Proyección</button>
  <button class="tab-btn" onclick="switchTab('alertas')" id="alertTabBtn">
    🔔 Alertas
    <span class="tab-badge" id="alertBadge" style="display:none">0</span>
  </button>
</nav>

<!-- ═══════════ CONTENT ═══════════ -->
<div class="content">

  <!-- TAB: Resumen -->
  <div class="tab-panel active" id="tab-resumen">
    <div class="card-grid" id="kpiGrid"></div>
    <div class="profile-grid" id="quickProfiles"></div>
  </div>

  <!-- TAB: Perfiles -->
  <div class="tab-panel" id="tab-perfiles">
    <div class="filter-bar" id="profileFilterBar"></div>
    <div class="profile-grid" id="allProfiles"></div>
  </div>

  <!-- TAB: Modelos -->
  <div class="tab-panel" id="tab-modelos">
    <div class="filter-bar">
      <button class="filter-chip active" data-model-filter="all" onclick="filterModels('all', this)">⚡ Todos</button>
      <button class="filter-chip" data-model-filter="deepseek" onclick="filterModels('deepseek', this)">🐋 DeepSeek</button>
      <button class="filter-chip" data-model-filter="xiaomi" onclick="filterModels('xiaomi', this)">📱 Xiaomi</button>
      <button class="filter-chip" data-model-filter="openrouter" onclick="filterModels('openrouter', this)">🔗 OpenRouter</button>
      <input type="text" class="filter-search" placeholder="🔍 Buscar modelo..." 
             oninput="filterModels(document.querySelector('.filter-chip.active[data-model-filter]')?.dataset?.modelFilter||'all', null, this.value)"
             id="modelSearch">
      <span class="filter-count" id="modelCount"></span>
    </div>
    <div class="model-list" id="modelList"></div>
  </div>

  <!-- TAB: Proyección -->
  <div class="tab-panel" id="tab-proyeccion">
    <div class="projection-container">
      <div class="projection-card" id="projectionCard"></div>
    </div>
  </div>

  <!-- TAB: Alertas -->
  <div class="tab-panel" id="tab-alertas">
    <div id="alertsDetail"></div>
  </div>

</div>

<div class="footer">
  Hermes Watchdog · Actualización cada 2 horas · 
  <span id="footerGenTime"></span> · 
  <a href="https://github.com/cacarotmaster/hermes-dashboard" style="color:var(--accent-cyan);text-decoration:none">GitHub</a>
</div>

<script>
/* ═══════════════════════════════════════════
   HERMES WATCHDOG — Dashboard Engine
   ═══════════════════════════════════════════ */

let DATA = null;
const DATA_URL = 'data.json';
const MAX_STALE_MINUTES = 130; // 2h + 10min grace

// ═══ INIT ═══
async function init() {
  try {
    const resp = await fetch(DATA_URL);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    DATA = await resp.json();
    renderAll();
  } catch (e) {
    showError('No se pudo cargar data.json — ¿el dashboard está actualizado?');
    console.error(e);
  }
}

function renderAll() {
  if (!DATA) return;
  updateStatus();
  renderAlerts();
  renderKPIs();
  renderQuickProfiles();
  buildProfileFilters();
  renderAllProfiles();
  renderModels();
  renderProjection();
  renderAlertsDetail();
  document.getElementById('footerGenTime').textContent =
    'Generado: ' + formatTime(DATA.generated_at);
}

// ═══ STATUS ═══
function updateStatus() {
  const age = (Date.now() / 1000) - DATA.generated_at_unix;
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  const time = document.getElementById('updateTime');

  if (age < MAX_STALE_MINUTES * 60) {
    dot.className = 'status-dot live';
    txt.textContent = 'En vivo';
    time.textContent = 'Actualizado: ' + formatRelative(age);
  } else {
    dot.className = 'status-dot stale';
    txt.textContent = 'Desactualizado';
    time.textContent = 'Última: ' + formatRelative(age);
  }
}

// ═══ ALERTS ═══
function renderAlerts() {
  const banner = document.getElementById('alertBanner');
  const text = document.getElementById('alertText');
  const badge = document.getElementById('alertBadge');
  const btn = document.getElementById('alertTabBtn');

  if (!DATA.alerts || DATA.alerts.length === 0) {
    banner.classList.remove('show', 'critical', 'warning');
    badge.style.display = 'none';
    return;
  }

  const crit = DATA.alerts.filter(a => a.severity === 'critical');
  const warn = DATA.alerts.filter(a => a.severity === 'warning');

  if (crit.length > 0) {
    banner.className = 'alert-banner show critical';
    text.innerHTML = `<strong>${crit.length} alerta(s) crítica(s)</strong> — ${crit[0].message}`;
  } else if (warn.length > 0) {
    banner.className = 'alert-banner show warning';
    text.innerHTML = `<strong>${warn.length} advertencia(s)</strong> — ${warn[0].message}`;
  }

  badge.style.display = 'inline-block';
  badge.textContent = DATA.alerts.length;
}

function dismissAlert() {
  document.getElementById('alertBanner').classList.remove('show');
}

// ═══ TAB SWITCHING ═══
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`.tab-btn[onclick*="${name}"]`).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

// ═══ KPIs ═══
function renderKPIs() {
  const s = DATA.system;
  const grid = document.getElementById('kpiGrid');

  const ramPct = (s.ram && s.ram.percent) ? s.ram.percent : 0;
  const diskPct = (s.disk && s.disk.percent) ? s.disk.percent : 0;
  const ramClass = ramPct > 85 ? 'danger' : ramPct > 65 ? 'warn' : 'safe';
  const diskClass = diskPct > 85 ? 'danger' : diskPct > 70 ? 'warn' : 'safe';

  const totalTokens = DATA.grand_total_tokens || 0;
  const totalCost = DATA.models ? DATA.models.reduce((s,m) => s + (m.estimated_cost_usd||0), 0) : 0;

  grid.innerHTML = `
    <div class="card ram">
      <div class="card-label">💾 RAM</div>
      <div class="card-value">${ramPct}%</div>
      <div class="card-sub">${s.ram ? fmt(s.ram.used_gb) : '--'} / ${s.ram ? fmt(s.ram.total_gb) : '--'} GB</div>
      <div class="progress-bar"><div class="progress-fill ${ramClass}" style="width:${ramPct}%"></div></div>
    </div>
    <div class="card disk">
      <div class="card-label">💿 Disco</div>
      <div class="card-value">${diskPct}%</div>
      <div class="card-sub">${s.disk ? fmt(s.disk.used_gb) : '--'} / ${s.disk ? fmt(s.disk.total_gb) : '--'} GB</div>
      <div class="progress-bar"><div class="progress-fill ${diskClass}" style="width:${diskPct}%"></div></div>
    </div>
    <div class="card tokens">
      <div class="card-label">🧠 Tokens totales</div>
      <div class="card-value">${formatTokens(totalTokens)}</div>
      <div class="card-sub">${DATA.grand_total_sessions || 0} sesiones · ${(DATA.grand_total_calls||0).toLocaleString()} llamadas</div>
    </div>
    <div class="card cost">
      <div class="card-label">💰 Costo acumulado</div>
      <div class="card-value">$${totalCost.toFixed(2)}</div>
      <div class="card-sub">${DATA.models ? DATA.models.length : 0} modelos · ${DATA.profiles ? DATA.profiles.length : 0} perfiles</div>
    </div>
  `;
}

// ═══ PROFILES (with dynamic filters) ═══
let profileFilter = 'all';
let profileSortBy = 'tokens-desc';

function buildProfileFilters() {
  const profiles = DATA.profiles || [];
  const bar = document.getElementById('profileFilterBar');
  const labels = [...new Set(profiles.map(p => p.label || p.user_id))].filter(Boolean);

  let html = '<button class="filter-chip active" data-pf="all" onclick="filterProfiles(\'all\', this)">⚡ Todos</button>';
  for (const label of labels) {
    html += `<button class="filter-chip" data-pf="${escAttr(label)}" onclick="filterProfiles('${escAttr(label)}', this)">👤 ${esc(label)}</button>`;
  }
  html += `
    <select class="filter-sort" onchange="sortProfiles(this.value)" id="profileSort">
      <option value="tokens-desc">🔥 Más tokens</option>
      <option value="tokens-asc">🧊 Menos tokens</option>
      <option value="sessions-desc">📊 Más sesiones</option>
      <option value="cost-desc">💰 Más costo</option>
      <option value="daily-desc">⚡ Más tokens/día</option>
      <option value="images-desc">🖼️ Más imágenes</option>
    </select>
    <span class="filter-count" id="profileCount"></span>`;
  bar.innerHTML = html;
}

function filterProfiles(filter, btn) {
  profileFilter = filter;
  document.querySelectorAll('#profileFilterBar .filter-chip').forEach(c => c.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else document.querySelector('#profileFilterBar .filter-chip[data-pf="' + filter + '"]')?.classList.add('active');
  renderAllProfiles();
}

function sortProfiles(sortBy) {
  profileSortBy = sortBy;
  renderAllProfiles();
}

function getFilteredProfiles() {
  let profiles = [...(DATA.profiles || [])];
  
  // Filter
  if (profileFilter !== 'all') {
    profiles = profiles.filter(p => (p.label || p.user_id) === profileFilter);
  }
  
  // Sort
  const sorters = {
    'tokens-desc': (a, b) => (b.total_tokens || 0) - (a.total_tokens || 0),
    'tokens-asc': (a, b) => (a.total_tokens || 0) - (b.total_tokens || 0),
    'sessions-desc': (a, b) => (b.sessions || 0) - (a.sessions || 0),
    'cost-desc': (a, b) => (b.estimated_cost_usd || 0) - (a.estimated_cost_usd || 0),
    'daily-desc': (a, b) => (b.tokens_per_day || 0) - (a.tokens_per_day || 0),
    'images-desc': (a, b) => (b.image_count || 0) - (a.image_count || 0),
  };
  profiles.sort(sorters[profileSortBy] || sorters['tokens-desc']);
  
  return profiles;
}

function renderAllProfiles() {
  const profiles = getFilteredProfiles();
  const grid = document.getElementById('allProfiles');
  const count = document.getElementById('profileCount');
  grid.innerHTML = profiles.map(p => profileCardHTML(p)).join('');
  if (count) count.textContent = `${profiles.length} perfil(es)`;
}

// ═══ PROFILE CARD (updated with image count) ═══
function profileCardHTML(p) {
  const srcClass = 'source-' + (p.source || 'unknown');
  const imgCount = p.image_count || 0;
  const imgRow = imgCount > 0 
    ? `<span class="profile-model-badge" style="background:rgba(236,72,153,0.08);color:var(--accent-pink);border-color:rgba(236,72,153,0.15)">🖼️ ${imgCount} img</span>`
    : '';
  return `
    <div class="profile-card">
      <div class="profile-header">
        <div>
          <div class="profile-name">${esc(p.label || p.user_id)}</div>
          <div style="font-size:0.72rem;color:var(--text-muted)">${esc(p.user_id)}</div>
        </div>
        <span class="profile-source ${srcClass}">${p.source || '?'}</span>
      </div>
      <div class="profile-stats">
        <div class="profile-stat">
          <div class="stat-label">Sesiones</div>
          <div class="stat-value">${p.sessions}</div>
        </div>
        <div class="profile-stat">
          <div class="stat-label">Tokens totales</div>
          <div class="stat-value">${formatTokens(p.total_tokens)}</div>
        </div>
        <div class="profile-stat">
          <div class="stat-label">Tokens/día</div>
          <div class="stat-value">${formatTokens(p.tokens_per_day)}</div>
        </div>
        <div class="profile-stat">
          <div class="stat-label">Proy. mensual</div>
          <div class="stat-value">${formatTokens(p.projected_monthly_tokens)}</div>
        </div>
      </div>
      <div>
        <span class="profile-model-badge">🤖 ${esc(p.favorite_model)}</span>
        ${p.estimated_cost_usd ? `<span class="profile-model-badge" style="background:rgba(16,185,129,0.08);color:var(--accent-emerald);border-color:rgba(16,185,129,0.15)">$${p.estimated_cost_usd.toFixed(3)}</span>` : ''}
        ${imgRow}
      </div>
    </div>
  `;
}

// ═══ MODELS (with filter + search) ═══
let modelFilter = 'all';
let modelSearchTerm = '';

function filterModels(filter, btn, searchTerm) {
  modelFilter = filter;
  if (searchTerm !== undefined) modelSearchTerm = searchTerm.toLowerCase();
  document.querySelectorAll('[data-model-filter]').forEach(c => c.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else document.querySelector('[data-model-filter="' + filter + '"]')?.classList.add('active');
  renderModels();
}

function getFilteredModels() {
  let models = [...(DATA.models || [])];
  
  if (modelFilter !== 'all') {
    models = models.filter(m => {
      const prov = (m.provider || '').toLowerCase();
      return prov.includes(modelFilter);
    });
  }
  
  if (modelSearchTerm) {
    models = models.filter(m => 
      (m.model || '').toLowerCase().includes(modelSearchTerm) ||
      (m.provider || '').toLowerCase().includes(modelSearchTerm)
    );
  }
  
  return models;
}

function renderModels() {
  const list = document.getElementById('modelList');
  const count = document.getElementById('modelCount');
  const models = getFilteredModels();
  const maxTokens = models.length > 0 ? models[0].total_tokens : 1;

  list.innerHTML = models.slice(0, 15).map((m, i) => {
    const pct = maxTokens > 0 ? (m.total_tokens / maxTokens * 100) : 0;
    const rankClass = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
    const barClass = 'bar-' + (i % 8);
    return `
      <div class="model-row">
        <div class="model-rank ${rankClass}">${i + 1}</div>
        <div class="model-info">
          <div class="model-name">${esc(m.model)}</div>
          <div class="model-provider">${esc(m.provider)} · ${m.sessions} sesiones · ${(m.calls||0).toLocaleString()} calls</div>
        </div>
        <div class="model-bar-wrap">
          <div class="model-bar ${barClass}" style="width:${Math.max(pct, 2)}%"></div>
        </div>
        <div class="model-tokens">${formatTokens(m.total_tokens)}</div>
        <div class="model-percent">${m.percent}%</div>
      </div>
    `;
  }).join('');
  
  if (count) count.textContent = `${models.length} modelo(s)`;
}

// ═══ QUICK PROFILES (Resumen tab) ═══
function renderQuickProfiles() {
  const grid = document.getElementById('quickProfiles');
  const profiles = (DATA.profiles || []).slice(0, 4);
  grid.innerHTML = profiles.map(p => profileCardHTML(p)).join('');
}

// ═══ PROJECTION ═══
function renderProjection() {
  const proj = DATA.projection || {};
  const card = document.getElementById('projectionCard');
  const currentProfiles = proj.current_profiles || 5;
  const avgDaily = proj.avg_daily_tokens_per_profile || 0;

  card.innerHTML = `
    <h3 style="font-size:1.1rem;margin-bottom:0.3rem">📈 Proyección de consumo</h3>
    <p style="font-size:0.82rem;color:var(--text-secondary);margin-bottom:1.5rem">
      Basado en ${currentProfiles} perfiles activos · Media: ${formatTokens(avgDaily)} tokens/día por perfil
    </p>
    <div class="slider-group">
      <div class="slider-label">
        <span>Perfiles proyectados</span>
        <span id="sliderValue">6</span>
      </div>
      <input type="range" min="1" max="12" value="6" step="1"
             oninput="updateProjection(this.value)">
    </div>
    <div class="projection-result" id="projectionResult"></div>
    <p style="font-size:0.72rem;color:var(--text-muted);margin-top:1rem">
      * Incluye margen de crecimiento del ${proj.growth_margin_percent || 15}%
    </p>
  `;
  updateProjection(6);
}

function updateProjection(n) {
  const proj = DATA.projection || {};
  const avgDaily = proj.avg_daily_tokens_per_profile || 0;
  const margin = (proj.growth_margin_percent || 15) / 100;
  n = parseInt(n);

  const daily = avgDaily * n;
  const monthly = daily * 30;
  const withMargin = monthly * (1 + margin);

  document.getElementById('sliderValue').textContent = n;
  document.getElementById('projectionResult').innerHTML = `
    <div class="projection-box">
      <div class="box-label">Tokens / día (${n} perfiles)</div>
      <div class="box-value">${formatTokens(daily)}</div>
    </div>
    <div class="projection-box">
      <div class="box-label">Tokens / mes (con margen)</div>
      <div class="box-value">${formatTokens(withMargin)}</div>
    </div>
    <div class="projection-box">
      <div class="box-label">Tokens / mes (base)</div>
      <div class="box-value">${formatTokens(monthly)}</div>
    </div>
    <div class="projection-box">
      <div class="box-label">Costo est. mensual *</div>
      <div class="box-value" style="background:linear-gradient(135deg,#10b981,#059669);-webkit-background-clip:text;background-clip:text">
        $${(withMargin / 1e6 * 0.30).toFixed(2)}
      </div>
    </div>
  `;
}

// ═══ ALERTS DETAIL ═══
function renderAlertsDetail() {
  const container = document.getElementById('alertsDetail');
  const alerts = DATA.alerts || [];

  if (alerts.length === 0) {
    container.innerHTML = `
      <div style="text-align:center;padding:3rem;color:var(--text-muted)">
        <div style="font-size:3rem;margin-bottom:1rem">✅</div>
        <p>Sin alertas activas</p>
        <p style="font-size:0.78rem">Todo funciona correctamente</p>
      </div>`;
    return;
  }

  const sevColors = {
    critical: 'var(--accent-rose)',
    warning: 'var(--accent-amber)',
    info: 'var(--accent-cyan)'
  };
  const sevIcons = { critical: '🔴', warning: '🟡', info: '🔵' };

  container.innerHTML = alerts.map(a => `
    <div style="
      background:var(--bg-card);
      border:1px solid ${sevColors[a.severity]}22;
      border-left:3px solid ${sevColors[a.severity]};
      border-radius:var(--radius-md);
      padding:1rem 1.3rem;
      margin-bottom:0.7rem;
      backdrop-filter:blur(12px)
    ">
      <div style="display:flex;align-items:center;gap:0.6rem;margin-bottom:0.4rem">
        <span style="font-size:1.2rem">${sevIcons[a.severity] || '⚪'}</span>
        <strong style="color:${sevColors[a.severity]};text-transform:uppercase;font-size:0.78rem;letter-spacing:0.04em">
          ${a.severity}
        </strong>
        <span style="font-size:0.72rem;color:var(--text-muted);margin-left:auto">
          ${esc(a.type)}
        </span>
      </div>
      <p style="font-size:0.9rem;margin:0.4rem 0">${esc(a.message)}</p>
      ${a.details ? '<pre style="font-size:0.7rem;color:var(--text-muted);background:var(--bg-elevated);padding:0.5rem;border-radius:4px;overflow-x:auto;margin-top:0.5rem">' + 
        JSON.stringify(a.details, null, 2) + '</pre>' : ''}
    </div>
  `).join('');
}

// ═══ HELPERS ═══
function fmt(n) { return (n || 0).toFixed(1); }

function formatTokens(n) {
  if (!n || n === 0) return '0';
  if (n >= 1e9) return (n/1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(0) + 'K';
  return n.toString();
}

function formatTime(iso) {
  if (!iso) return '--';
  const d = new Date(iso);
  return d.toLocaleString('es-CO', { dateStyle:'medium', timeStyle:'short' });
}

function formatRelative(seconds) {
  if (seconds < 60) return 'Ahora';
  if (seconds < 3600) return `Hace ${Math.floor(seconds/60)} min`;
  if (seconds < 86400) return `Hace ${Math.floor(seconds/3600)} h`;
  return `Hace ${Math.floor(seconds/86400)} d`;
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function escAttr(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function showError(msg) {
  document.getElementById('kpiGrid').innerHTML =
    `<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--text-muted)">
      <div style="font-size:3rem;margin-bottom:1rem">🔌</div>
      <p>${msg}</p>
    </div>`;
}

// ═══ START ═══
init();
</script>
</body>
</html>
